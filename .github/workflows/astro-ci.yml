name: Astro CI

# Gate for this repo's canonical stack. Decision record: STACK.md.
#   Canonical public site = Hugo 0.140.2 + postcss + tailwindcss v3 -> docs/
#   (that is what https://hairathome.reverb256.ca/ serves).
#   src/*.astro is half-migrated work from feature/astro-migration; it is not
#   built for the public site.
#
# Trigger note (incident 2026-10-16, kanban t_ad03095f): this workflow used to
# run only on pull_request:[main] and push:[feature/astro-migration]. Main itself
# was never gated, so a package-lock.json that npm 10 cannot install landed on
# main (f340d20) and every open PR died at "Install dependencies"
# (run 38899288233: "npm ci EUSAGE ... Missing: esbuild@0.28.2 from lock file").
# Main pushes now run the gate.
on:
  push:
    branches: [main, feature/astro-migration]
  pull_request:
    branches: [main]

jobs:
  # Regression gate for the lockfile incident above: package-lock.json must stay
  # installable by BOTH npm majors in use in this fleet:
  #   node 22 -> npm 10  (GitHub runners, build-test below)
  #   node 26 -> npm 11  (nexus dev boxes, where the lock file is regenerated)
  # A lock file generated by npm 11 only is what broke main for npm 10.
  lockfile-sync:
    name: lockfile-sync (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '26']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Show toolchain
        run: node -v && npm -v

      - name: Install dependencies
        run: npm ci

  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install Hugo
        run: |
          curl -L -o hugo.tar.gz https://github.com/gohugoio/hugo/releases/download/v0.140.2/hugo_extended_0.140.2_Linux-64bit.tar.gz
          tar -xzf hugo.tar.gz
          sudo mv hugo /usr/local/bin/
          hugo version

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx astro check

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f docs/index.html
          test -f docs/services/index.html
          echo "docs/ pages: $(find docs -name index.html | wc -l)"

      # E2E is scoped to the migration branch on purpose: tests/basic.spec.ts
      # asserts that branch's markup (e.g. h1 "What We Offer" on /services/),
      # which the canonical Hugo pages do not have, and playwright.config.ts
      # serves an Astro preview that main does not build.
      - name: Install Playwright
        if: github.ref == 'refs/heads/feature/astro-migration'
        run: npx playwright install --with-deps

      - name: Run tests
        if: github.ref == 'refs/heads/feature/astro-migration'
        run: npm run test

      - name: Upload test results
        if: always() && github.ref == 'refs/heads/feature/astro-migration'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  deploy-preview:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feature/astro-migration' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install Hugo
        run: |
          curl -L -o hugo.tar.gz https://github.com/gohugoio/hugo/releases/download/v0.140.2/hugo_extended_0.140.2_Linux-64bit.tar.gz
          tar -xzf hugo.tar.gz
          sudo mv hugo /usr/local/bin/
          hugo version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ./astro-preview
